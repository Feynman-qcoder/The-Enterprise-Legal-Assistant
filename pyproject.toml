# 项目元数据与依赖声明：可与 uv 配合使用；日常也可用 pip install -r requirements.txt
[project]
name = "xiaoyi-rag"
version = "0.1.0"
description = "小意：法律法规 RAG 问答系统（LangChain + Milvus + FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "greenlet>=3.0.0",
    "redis[hiredis]>=5.2.0",
    "pymilvus>=2.4.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "PyYAML>=6.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "torch>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["offline/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
