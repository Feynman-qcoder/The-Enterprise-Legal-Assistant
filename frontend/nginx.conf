# Frontend nginx 配置（Task 21 Part 4）：
# 静态托管 vite 构建产物 + /api 反代到 backend 容器（SSE 流式必需关闭缓冲）。

server {
    listen 80;
    server_name _;

    # /api 反代：后端 compose 服务名 backend（同默认网络）
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式关键：关闭缓冲与缓存，响应分片直达浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;  # LLM 长流（含 B3 重试）余量
        proxy_send_timeout 300s;
    }

    # Vue 单页应用静态资源 + history 路由回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
